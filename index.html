<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.5, minimum-scale=0.1, maximum-scale=3.0, user-scalable=yes">
  <title>Cây Gia Phả Dòng Họ Lâm</title>
  <style>
    :root { --bg:#f8fafc; --card:#fff; --border:#cbd5e1; --text:#0f172a; --muted:#64748b; --primary:#2563eb; --success:#10b981; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
    header { background:#fff; border-bottom:1px solid var(--border); padding:10px 14px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; z-index:30; }
    .brand { font-weight:700; font-size:1.05rem; }
    .top-actions { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .btn { padding:7px 11px; border-radius:8px; border:1px solid transparent; font-size:0.8rem; font-weight:600; cursor:pointer; font-family:inherit; }
    .btn-save { background:var(--success); color:#fff; }
    .btn-share { background:var(--primary); color:#fff; }
    .btn-sub { background:#f1f5f9; color:#334155; border-color:var(--border); }
    .btn-del { background:#fee2e2; color:#ef4444; }
    
    #canvas {
      flex:1;
      overflow:auto;
      padding:60px 40px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      background-image:radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
      background-size:20px 20px;
      position:relative;
    }

    .tree-box {
      transform-origin: top center;
      display: inline-block;
      margin: auto;
      transition: transform 0.15s ease-out;
    }
    
    .zoom-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: 30px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
      z-index: 99;
    }
    .zoom-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #eff6ff;
      border: 1px solid var(--border);
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--primary);
    }
    .zoom-text { font-size: 0.85rem; font-weight: 700; min-width: 50px; text-align: center; }

    .tree, .tree ul { display:flex; justify-content:center; padding-top:24px; position:relative; list-style-type:none; }
    .tree li { float:left; text-align:center; list-style-type:none; position:relative; padding:24px 12px 10px 12px; }
    .tree li::before, .tree li::after { content:''; position:absolute; top:0; right:50%; border-top:2px solid #94a3b8; width:50%; height:24px; }
    .tree li::after { right:auto; left:50%; border-left:2px solid #94a3b8; }
    .tree li:only-child::after, .tree li:only-child::before { display:none; }
    .tree li:only-child { padding-top:0; }
    .tree li:first-child::before, .tree li:last-child::after { border:0 none; }
    .tree li:last-child::before { border-right:2px solid #94a3b8; border-radius:0 8px 0 0; }
    .tree li:first-child::after { border-radius:8px 0 0 0; }
    .tree ul::before { content:''; position:absolute; top:0; left:50%; border-left:2px solid #94a3b8; width:0; height:24px; }
    .family { display:inline-flex; align-items:center; gap:8px; }
    .ring { background:#fef3c7; border:1px dashed #d97706; border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; }
    .card { background:var(--card); border:1.5px solid var(--border); border-radius:12px; padding:10px; width:200px; text-align:left; box-shadow:0 4px 10px rgba(0,0,0,0.03); }
    .card.male { border-top:4px solid #0284c7; }
    .card.female { border-top:4px solid #e11d48; }
    .card-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .ava { width:42px; height:42px; border-radius:50%; object-fit:cover; background:#f1f5f9; border:1.5px solid var(--border); flex-shrink:0; }
    .c-name { font-weight:700; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .c-year { font-size:0.72rem; color:var(--muted); margin-top:2px; }
    .c-contact { display:inline-block; font-size:0.7rem; padding:2px 6px; border-radius:5px; margin-top:5px; background:#e0f2fe; color:#0284c7; font-weight:600; text-decoration:none; }
    .card-foot { display:flex; justify-content:space-between; align-items:center; margin-top:8px; padding-top:6px; border-top:1px solid #f1f5f9; }
    .btn-plus { width:26px; height:26px; border-radius:50%; background:var(--primary); color:#fff; border:none; font-size:1rem; cursor:pointer; }
    .btn-action { background:none; border:none; font-size:0.72rem; color:var(--muted); cursor:pointer; }
    .empty { display:flex; align-items:center; justify-content:center; margin:80px auto; }
    .btn-root { background:var(--primary); color:#fff; border:none; padding:13px 22px; border-radius:12px; font-size:0.95rem; font-weight:700; cursor:pointer; }
    
    .modal { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:100; padding:14px; }
    .modal.active { display:flex; }
    .modal-card { background:#fff; border-radius:14px; width:100%; max-width:400px; padding:18px; max-height:90vh; overflow-y:auto; }
    .modal-title { display:flex; justify-content:space-between; font-weight:700; margin-bottom:12px; }
    .form-item { margin-bottom:10px; }
    .form-item label { display:block; font-size:0.72rem; font-weight:600; color:var(--muted); margin-bottom:3px; }
    .form-item input, .form-item select, .form-item textarea { width:100%; padding:8px 10px; border-radius:7px; border:1px solid var(--border); font-family:inherit; font-size:0.85rem; }
    .choice-list { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
    .choice-item { padding:10px; border-radius:8px; border:1px solid var(--border); background:#f8fafc; text-align:left; cursor:pointer; display:flex; gap:8px; align-items:center; }
    .choice-parent { background:#fefce8; border-color:#fde047; }
  </style>
</head>
<body>

  <header>
    <div class="brand">🌳 Gia Phả Họ Lâm</div>
    <div class="top-actions">
      <button class="btn btn-save" onclick="saveData(true)">💾 LƯU MÁY</button>
      <button class="btn btn-share" onclick="copyDataCode()">📋 SAO CHÉP MÃ</button>
      <button class="btn btn-sub" onclick="openImportCodeModal()">📥 DÁN MÃ VÀO</button>
      <button class="btn btn-sub" onclick="exportJSON()">📁 Xuất Tệp</button>
      <button class="btn btn-del" onclick="resetAll()">🗑️ Xóa</button>
    </div>
  </header>

  <main id="canvas">
    <div class="tree-box" id="treeBox"></div>
  </main>

  <div class="zoom-bar">
    <button class="zoom-btn" onclick="adjustZoom(-0.15)">➖</button>
    <span class="zoom-text" id="zoomVal" onclick="resetZoom()">100%</span>
    <button class="zoom-btn" onclick="adjustZoom(0.15)">➕</button>
  </div>

  <!-- Hộp thoại Dán Mã Dữ Liệu -->
  <div class="modal" id="modalImportCode">
    <div class="modal-card">
      <div class="modal-title"><span>Dán Mã Dữ Liệu Gia Phả</span><button onclick="closeMod('modalImportCode')" style="border:none;background:none;font-size:1.1rem;cursor:pointer;">✕</button></div>
      <p style="font-size:0.75rem; color:#64748b; margin-bottom:8px;">Dán đoạn mã được người thân gửi qua Zalo vào khung dưới đây:</p>
      <textarea id="importCodeInput" rows="6" placeholder="Dán mã vào đây..."></textarea>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button type="button" class="btn btn-share" style="flex:1;padding:9px;" onclick="applyImportCode()">Nạp Cây Gia Phả</button>
        <button type="button" class="btn btn-sub" onclick="closeMod('modalImportCode')">Hủy</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modalChoice">
    <div class="modal-card">
      <div class="modal-title"><span>Thêm Quan Hệ</span><button onclick="closeMod('modalChoice')" style="border:none;background:none;font-size:1.1rem;cursor:pointer;">✕</button></div>
      <div class="choice-list">
        <button class="choice-item choice-parent" onclick="startAdd('parent')"><span style="font-size:1.3rem;">🧓</span><div><strong>Thêm Cha / Mẹ (Chĩa lên trên)</strong><div style="font-size:0.72rem;color:var(--muted);">Đẩy người hiện tại làm con, thêm cha mẹ ở trên</div></div></button>
        <button class="choice-item" onclick="startAdd('spouse')"><span style="font-size:1.3rem;">💍</span><div><strong>Thêm Vợ / Chồng (Nối ngang)</strong><div style="font-size:0.72rem;color:var(--muted);">Nối cùng hàng ngang</div></div></button>
        <button class="choice-item" onclick="startAdd('child')"><span style="font-size:1.3rem;">👶</span><div><strong>Thêm Con Cái (Rẽ nhánh xuống)</strong><div style="font-size:0.72rem;color:var(--muted);">Tạo con cháu ở tầng dưới</div></div></button>
      </div>
    </div>
  </div>

  <div class="modal" id="modalForm">
    <div class="modal-card">
      <div class="modal-title"><span id="formHeader">Thông Tin</span><button onclick="closeMod('modalForm')" style="border:none;background:none;font-size:1.1rem;cursor:pointer;">✕</button></div>
      <form id="infoForm" onsubmit="submitForm(event)">
        <input type="hidden" id="fId"><input type="hidden" id="fTarget"><input type="hidden" id="fRel">
        <div class="form-item"><label>Họ và Tên (*)</label><input type="text" id="fName" placeholder="Nguyễn Văn An" required></div>
        <div style="display:flex;gap:8px;">
          <div class="form-item" style="flex:1;"><label>Giới tính</label><select id="fGender"><option value="male">Nam</option><option value="female">Nữ</option></select></div>
          <div class="form-item" style="flex:1;"><label>Năm sinh</label><input type="text" id="fYear" placeholder="1965"></div>
        </div>
        <div class="form-item"><label>Liên hệ (Zalo / FB)</label><input type="text" id="fContact" placeholder="Số Zalo hoặc link FB"></div>
        <div class="form-item"><label>Ảnh đại diện (Nén siêu nhẹ)</label><input type="file" id="fImg" accept="image/*" onchange="compressAndPreviewImg(event)"><img id="imgPrev" style="width:36px;height:36px;border-radius:50%;display:none;margin-top:6px;object-fit:cover;"></div>
        <div style="display:flex;gap:8px;margin-top:12px;"><button type="submit" class="btn btn-share" style="flex:1;padding:9px;">Lưu</button><button type="button" class="btn btn-sub" onclick="closeMod('modalForm')">Hủy</button></div>
      </form>
    </div>
  </div>

  <script>
    // Dữ liệu gốc họ Lâm luôn sẵn sàng hiển thị
    const baseTree = {
      id: "lai_01",
      name: "Lâm Thành Lai",
      gender: "male",
      year: "Đã mất",
      contact: "",
      avatar: "",
      spouse: {
        id: "dai_02",
        name: "Diệp Thị Dai",
        gender: "female",
        year: "Thành viên",
        contact: "",
        avatar: ""
      },
      children: [
        { id: "co_03", name: "Lâm Thành Cơ", gender: "male", year: "", contact: "", avatar: "", children: [] },
        { id: "nha_04", name: "Lâm Thành Nhã", gender: "male", year: "Thành viên", contact: "", avatar: "", children: [] }
      ]
    };

    let tree = null, currTarget = null, tempAva = '';
    let scale = 1.0;
    const STORAGE_KEY = 'giapha_lam_fixed_v4';

    function adjustZoom(delta) {
      scale = Math.min(Math.max(0.15, scale + delta), 2.5);
      applyZoom();
    }
    function resetZoom() {
      scale = 1.0;
      applyZoom();
    }
    function applyZoom() {
      document.getElementById('treeBox').style.transform = `scale(${scale})`;
      document.getElementById('zoomVal').innerText = Math.round(scale * 100) + '%';
    }

    window.addEventListener('DOMContentLoaded', () => {
      initTree();
    });

    function initTree() {
      // Đọc từ bộ nhớ máy
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) { tree = JSON.parse(s); }
      } catch(e) {}

      // Nếu chưa có, lấy dữ liệu gốc của cụ Lâm Thành Lai
      if (!tree) {
        tree = baseTree;
        saveData(false);
      }
      draw();
    }

    function draw() {
      const box = document.getElementById('treeBox'); box.innerHTML = '';
      if (!tree) {
        box.innerHTML = `<div class="empty"><button class="btn-root" onclick="startRoot()">🌱 + Bấm vào đây để tạo Người Khởi Đầu</button></div>`;
        return;
      }
      const r = document.createElement('div'); r.className = 'tree';
      const ul = document.createElement('ul'); ul.appendChild(renderNode(tree));
      r.appendChild(ul); box.appendChild(r);
      applyZoom();
    }

    function renderNode(n) {
      const li = document.createElement('li'); const f = document.createElement('div'); f.className = 'family'; f.appendChild(makeCard(n));
      if (n.spouse) {
        const rg = document.createElement('div'); rg.className = 'ring'; rg.innerText = '💍';
        f.appendChild(rg); f.appendChild(makeCard(n.spouse, true));
      }
      li.appendChild(f);
      if (n.children && n.children.length > 0) {
        const ul = document.createElement('ul');
        n.children.forEach(c => ul.appendChild(renderNode(c)));
        li.appendChild(ul);
      }
      return li;
    }

    function makeCard(n, isSpouse = false) {
      const d = document.createElement('div'); d.className = `card ${n.gender || 'male'}`;
      const ava = n.avatar || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";
      let cont = n.contact ? `<div class="c-contact">${n.contact}</div>` : '';
      d.innerHTML = `
        <div class="card-head">
          <img class="ava" src="${ava}">
          <div style="flex:1;overflow:hidden;">
            <div class="c-name">${n.name}</div>
            <div class="c-year">${n.year ? n.year : 'Thành viên'}</div>
            ${cont}
          </div>
        </div>
        <div class="card-foot">
          <button class="btn-action" onclick="editNode('${n.id}')">✏️ Sửa</button>
          ${isSpouse || n.id !== tree.id ? `<button class="btn-action" style="color:#ef4444;" onclick="delNode('${n.id}')">Xóa</button>` : ''}
          <button class="btn-plus" onclick="pickRel('${n.id}')">+</button>
        </div>
      `;
      return d;
    }

    function startRoot() {
      currTarget = null; document.getElementById('infoForm').reset();
      document.getElementById('fId').value = ''; document.getElementById('fRel').value = 'root';
      document.getElementById('formHeader').innerText = 'Tạo Người Khởi Đầu';
      document.getElementById('imgPrev').style.display = 'none'; tempAva = '';
      openMod('modalForm');
    }
    function pickRel(id) { currTarget = id; openMod('modalChoice'); }
    function startAdd(rel) {
      closeMod('modalChoice'); document.getElementById('infoForm').reset();
      document.getElementById('fId').value = ''; document.getElementById('fTarget').value = currTarget;
      document.getElementById('fRel').value = rel; document.getElementById('imgPrev').style.display = 'none'; tempAva = '';
      const t = { parent: 'Thêm Cha / Mẹ', spouse: 'Thêm Vợ / Chồng', child: 'Thêm Con Cái' };
      document.getElementById('formHeader').innerText = t[rel];
      openMod('modalForm');
    }
    function editNode(id) {
      const n = findN(tree, id); if (!n) return;
      document.getElementById('infoForm').reset();
      document.getElementById('fId').value = n.id; document.getElementById('fRel').value = 'edit';
      document.getElementById('fName').value = n.name || ''; document.getElementById('fGender').value = n.gender || 'male';
      document.getElementById('fYear').value = n.year || ''; document.getElementById('fContact').value = n.contact || '';
      tempAva = n.avatar || '';
      const p = document.getElementById('imgPrev');
      if (tempAva) { p.src = tempAva; p.style.display = 'block'; } else { p.style.display = 'none'; }
      document.getElementById('formHeader').innerText = 'Sửa Thông Tin';
      openMod('modalForm');
    }
    function submitForm(e) {
      e.preventDefault();
      const id = document.getElementById('fId').value, target = document.getElementById('fTarget').value, rel = document.getElementById('fRel').value;
      const name = document.getElementById('fName').value.trim(), gender = document.getElementById('fGender').value, year = document.getElementById('fYear').value.trim(), contact = document.getElementById('fContact').value.trim();
      if (rel === 'root') {
        tree = { id: 'p_' + Date.now(), name, gender, year, contact, avatar: tempAva, children: [] };
      } else if (rel === 'edit') {
        const n = findN(tree, id);
        if (n) { n.name = name; n.gender = gender; n.year = year; n.contact = contact; if (tempAva) n.avatar = tempAva; }
      } else if (rel === 'parent') {
        const o = tree;
        tree = { id: 'p_' + Date.now(), name, gender, year, contact, avatar: tempAva, children: [o] };
      } else if (rel === 'spouse') {
        const t = findN(tree, target);
        if (t) t.spouse = { id: 'p_' + Date.now(), name, gender, year, contact, avatar: tempAva };
      } else if (rel === 'child') {
        const t = findN(tree, target);
        if (t) {
          if (!t.children) t.children = [];
          t.children.push({ id: 'p_' + Date.now(), name, gender, year, contact, avatar: tempAva, children: [] });
        }
      }
      closeMod('modalForm'); 
      saveData(false);
      draw();
    }
    function delNode(id) { 
      if (!confirm('Xóa người này?')) return; 
      delRec(tree, id); 
      saveData(false); 
      draw(); 
    }
    function delRec(c, id) {
      if (c.spouse && c.spouse.id === id) { delete c.spouse; return true; }
      if (c.children) {
        const i = c.children.findIndex(x => x.id === id);
        if (i !== -1) { c.children.splice(i, 1); return true; }
        for (let k of c.children) { if (delRec(k, id)) return true; }
      }
      return false;
    }
    function findN(c, id) {
      if (!c) return null;
      if (c.id === id) return c;
      if (c.spouse && c.spouse.id === id) return c.spouse;
      if (c.children) {
        for (let k of c.children) {
          const r = findN(k, id);
          if (r) return r;
        }
      }
      return null;
    }

    function compressAndPreviewImg(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 120;
          let w = img.width, h = img.height;
          if (w > h) { if (w > maxDim) { h *= maxDim / w; w = maxDim; } }
          else { if (h > maxDim) { w *= maxDim / h; h = maxDim; } }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          tempAva = canvas.toDataURL('image/jpeg', 0.7);
          const p = document.getElementById('imgPrev');
          p.src = tempAva; p.style.display = 'block';
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function openMod(id) { document.getElementById(id).classList.add('active'); }
    function closeMod(id) { document.getElementById(id).classList.remove('active'); }
    
    function saveData(showAlert = true) { 
      if (tree) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tree)); 
          if (showAlert) alert('✅ Đã lưu dữ liệu vào máy thành công!');
        } catch (err) {
          alert('Bộ nhớ đầy, hãy dùng tính năng Xuất Tệp để lưu!');
        }
      }
    }

    // SAO CHÉP MÃ GIA PHẢ: Gửi qua Zalo an toàn tuyệt đối
    function copyDataCode() {
      if (!tree) { alert('Chưa có thông tin!'); return; }
      try {
        const code = JSON.stringify(tree);
        navigator.clipboard.writeText(code).then(() => {
          alert('✅ ĐÃ SAO CHÉP MÃ DỮ LIỆU!\n\nBạn hãy mở Zalo và dán đoạn mã này gửi cho người thân.\nNgười nhận chỉ cần bấm [📥 DÁN MÃ VÀO] trên web là xem được ngay!');
        }).catch(() => {
          prompt('Sao chép toàn bộ mã trong ô này gửi qua Zalo:', code);
        });
      } catch(e) {
        alert('Lỗi sao chép mã!');
      }
    }

    function openImportCodeModal() {
      document.getElementById('importCodeInput').value = '';
      openMod('modalImportCode');
    }

    function applyImportCode() {
      const val = document.getElementById('importCodeInput').value.trim();
      if (!val) { alert('Vui lòng dán mã dữ liệu vào khung!'); return; }
      try {
        const parsed = JSON.parse(val);
        if (parsed && parsed.name) {
          tree = parsed;
          saveData(false);
          draw();
          closeMod('modalImportCode');
          alert('✅ ĐÃ NẠP CÂY GIA PHẢ THÀNH CÔNG!');
        } else {
          alert('Mã không hợp lệ!');
        }
      } catch(e) {
        alert('Đoạn mã bị thiếu hoặc dán sai! Vui lòng kiểm tra lại.');
      }
    }

    function exportJSON() {
      if (!tree) return;
      const a = document.createElement('a');
      a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tree, null, 2));
      a.download = "giapha_holam.json";
      document.body.appendChild(a); a.click(); a.remove();
    }

    function resetAll() {
      if (confirm('Khôi phục lại nhánh gốc họ Lâm?')) {
        tree = JSON.parse(JSON.stringify(baseTree)); 
        localStorage.removeItem(STORAGE_KEY);
