<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.6, minimum-scale=0.1, maximum-scale=3.0, user-scalable=yes">
  <title>Cây Gia Phả Dòng Họ Lâm</title>
  <style>
    :root {
      --primary: #1565c0;
      --bg: #f8fafc;
      --border: #cbd5e1;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --male-color: #0288d1;
      --female-color: #d81b60;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Màn hình khóa mật mã 123456 */
    #lockOverlay {
      position: fixed;
      inset: 0;
      background: #0f172a;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .lock-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .lock-card input {
      width: 100%;
      padding: 10px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
    }
    .lock-card button {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    nav {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      z-index: 100;
    }
    .nav-brand { font-size: 1.05rem; font-weight: 700; color: var(--primary); }
    .nav-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn {
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-save { background: #2e7d32; color: #fff; }
    .btn-file { background: #f1f5f9; color: #334155; border-color: var(--border); }
    .btn-del { background: #fee2e2; color: #ef4444; }

    #viewport {
      flex: 1;
      overflow: auto;
      padding: 60px 30px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      position: relative;
    }
    .tree-wrapper {
      display: inline-block;
      margin: auto;
      transform-origin: top center;
      transition: transform 0.1s ease-out;
    }
    .tree, .tree ul {
      display: flex;
      justify-content: center;
      padding-top: 25px;
      position: relative;
      list-style-type: none;
    }
    .tree li {
      float: left;
      text-align: center;
      list-style-type: none;
      position: relative;
      padding: 25px 10px 0 10px;
    }
    .tree li::before, .tree li::after {
      content: '';
      position: absolute;
      top: 0;
      right: 50%;
      border-top: 2px solid #94a3b8;
      width: 50%;
      height: 25px;
    }
    .tree li::after { right: auto; left: 50%; border-left: 2px solid #94a3b8; }
    .tree li:only-child::after, .tree li:only-child::before { display: none; }
    .tree li:only-child { padding-top: 0; }
    .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
    .tree li:last-child::before { border-right: 2px solid #94a3b8; border-radius: 0 8px 0 0; }
    .tree li:first-child::after { border-radius: 8px 0 0 0; }
    .tree ul::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      border-left: 2px solid #94a3b8;
      width: 0;
      height: 25px;
    }
    .couple-node { display: inline-flex; align-items: center; gap: 10px; }
    .ring-connector {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fef3c7;
      border: 1px dashed #d97706;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }
    .person-card {
      width: 140px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.04);
    }
    .person-card.male { border-top: 4px solid var(--male-color); }
    .person-card.female { border-top: 4px solid var(--female-color); }
    .avatar-wrapper {
      width: 55px;
      height: 55px;
      border-radius: 6px;
      margin: 0 auto 6px;
      overflow: hidden;
      background: #f1f5f9;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .person-name { font-weight: 700; font-size: 0.85rem; margin-bottom: 2px; }
    .person-meta { font-size: 0.72rem; color: var(--text-sub); }
    .card-actions {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-around;
    }
    .action-icon { font-size: 0.8rem; border: none; background: none; cursor: pointer; color: var(--primary); }

    .floating-zoom {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 90;
    }
    .zoom-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 15px;
    }
    .modal-overlay.active { display: flex; }
    .modal-window {
      background: #fff;
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 3px; color: var(--text-sub); }
    .form-group input, .form-group select {
      width: 100%; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.85rem; outline: none;
    }
    .preview-box { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; display: none; margin-top: 6px; }
    .choice-box { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .choice-btn {
      padding: 10px; border: 1px solid var(--border); background: #f8fafc; border-radius: 8px; cursor: pointer; text-align: left; display: flex; gap: 10px; align-items: center;
    }
  </style>
</head>
<body>

  <!-- Màn hình khóa đúng chuẩn mật mã 123456 -->
  <div id="lockOverlay">
    <div class="lock-card">
      <div style="font-size:2.5rem;margin-bottom:8px;">🔒</div>
      <h3 style="margin-bottom:6px;">Bảo Mật Gia Phả</h3>
      <p style="font-size:0.8rem;color:#64748b;margin-bottom:14px;">Vui lòng nhập mật mã dòng họ để truy cập</p>
      <input type="password" id="inputPass" placeholder="Nhập mật mã...">
      <button onclick="unlockTree()">Mở Khóa</button>
      <div id="errPass" style="color:#ef4444;font-size:0.75rem;margin-top:8px;display:none;">Mật khẩu không chính xác!</div>
    </div>
  </div>

  <nav>
    <div class="nav-brand">🌳 Gia Phả Dòng Họ Lâm</div>
    <div class="nav-actions">
      <button class="btn btn-save" onclick="saveToDB(true)">💾 Đã Tự Lưu</button>
      <button class="btn btn-file" onclick="exportFile()">📥 Xuất File Lưu</button>
      <label class="btn btn-file" style="margin:0;cursor:pointer;">
        📤 Nhập File
        <input type="file" id="inpFile" accept=".json" style="display:none;" onchange="importFile(event)">
      </label>
      <button class="btn btn-del" onclick="resetDefault()">🗑️ Khôi Phục Gốc</button>
    </div>
  </nav>

  <main id="viewport">
    <div class="tree-wrapper" id="treeContainer"></div>
  </main>

  <div class="floating-zoom">
    <button class="zoom-btn" onclick="zoom(-0.15)">➖</button>
    <span id="zoomDisplay" style="font-size:0.85rem;font-weight:700;min-width:48px;text-align:center;">100%</span>
    <button class="zoom-btn" onclick="zoom(0.15)">➕</button>
  </div>

  <div class="modal-overlay" id="choiceModal">
    <div class="modal-window">
      <h3 style="font-size:1.05rem;margin-bottom:12px;">Thêm Mối Quan Hệ</h3>
      <div class="choice-box">
        <button class="choice-btn" onclick="triggerForm('parent')">
          <span style="font-size:1.4rem;">🧓</span>
          <div><strong>Thêm Cha / Mẹ</strong><div style="font-size:0.75rem;color:#64748b;">Đẩy người hiện tại xuống bậc con</div></div>
        </button>
        <button class="choice-btn" onclick="triggerForm('spouse')">
          <span style="font-size:1.4rem;">💍</span>
          <div><strong>Thêm Vợ / Chồng</strong><div style="font-size:0.75rem;color:#64748b;">Nối ngang cùng hàng</div></div>
        </button>
        <button class="choice-btn" onclick="triggerForm('child')">
          <span style="font-size:1.4rem;">👶</span>
          <div><strong>Thêm Con Cái</strong><div style="font-size:0.75rem;color:#64748b;">Rẽ nhánh xuống tầng dưới</div></div>
        </button>
      </div>
      <button class="btn btn-file" style="width:100%;margin-top:12px;justify-content:center;" onclick="closeModal('choiceModal')">Hủy</button>
    </div>
  </div>

  <div class="modal-overlay" id="formModal">
    <div class="modal-window">
      <h3 style="font-size:1.05rem;margin-bottom:12px;" id="modalTitle">Thông Tin Thành Viên</h3>
      <form id="memberForm" onsubmit="submitForm(event)">
        <input type="hidden" id="fId">
        <input type="hidden" id="fTarget">
        <input type="hidden" id="fRel">

        <div class="form-group">
          <label>Họ và Tên (*)</label>
          <input type="text" id="fName" required>
        </div>
        <div style="display:flex;gap:8px;">
          <div class="form-group" style="flex:1;">
            <label>Giới tính</label>
            <select id="fGender">
              <option value="male">Nam</option>
              <option value="female">Nữ</option>
            </select>
          </div>
          <div class="form-group" style="flex:1;">
            <label>Năm sinh / Ghi chú</label>
            <input type="text" id="fYear" placeholder="Ví dụ: 1965">
          </div>
        </div>
        <div class="form-group">
          <label>Ảnh đại diện (Lưu dung lượng lớn bằng IndexedDB)</label>
          <input type="file" id="fAvatar" accept="image/*" onchange="uploadAvatar(event)">
          <img id="prevImg" class="preview-box">
        </div>

        <div style="display:flex;gap:8px;margin-top:14px;">
          <button type="submit" class="btn btn-save" style="flex:1;justify-content:center;padding:9px;">Lưu Dữ Liệu</button>
          <button type="button" class="btn btn-file" onclick="closeModal('formModal')">Hủy</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 1. DỮ LIỆU CÂY MẪU CHÍNH THỨC CỐ ĐỊNH BAN ĐẦU
    const defaultData = {
      id: "lai_root",
      name: "Lâm Thành Lai",
      gender: "male",
      year: "Đã mất",
      avatar: "",
      spouse: {
        id: "dai_spouse",
        name: "Diệp Thị Dai",
        gender: "female",
        year: "Thành viên",
        avatar: ""
      },
      children: [
        { id: "co_child", name: "Lâm Thành Cơ", gender: "male", year: "", avatar: "", children: [] },
        { id: "nha_child", name: "Lâm Thành Nhã", gender: "male", year: "Thành viên", avatar: "", children: [] }
      ]
    };

    let familyTreeData = null;
    let selectedId = null;
    let tempAvatar = "";
    let zoomLevel = 1.0;

    // 2. MỞ KHÓA MẬT MÃ 123456
    function unlockTree() {
      const pass = document.getElementById("inputPass").value;
      if (pass === "123456") {
        document.getElementById("lockOverlay").style.display = "none";
        sessionStorage.setItem("tree_unlocked", "yes");
      } else {
        document.getElementById("errPass").style.display = "block";
      }
    }

    // 3. HỆ THỐNG LƯU TRỮ INDEXEDDB (KHÔNG LO TRÀN BỘ NHỚ, KHÔNG CẦN LINK DÀI)
    const DB_NAME = "GiaPhaHoLamDB";
    let db;
    function initDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          e.target.result.createObjectStore("treeStore", { keyPath: "id" });
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve();
        };
      });
    }

    function saveToDB(alertUser = false) {
      if (!db || !familyTreeData) return;
      const tx = db.transaction("treeStore", "readwrite");
      tx.objectStore("treeStore").put({ id: "CURRENT_TREE", data: familyTreeData });
      tx.oncomplete = () => {
        if (alertUser) alert("✅ Dữ liệu cây và ảnh đã được lưu bền vững trên máy này!");
      };
    }

    function loadFromDB() {
      return new Promise((resolve) => {
        if (!db) return resolve(null);
        const tx = db.transaction("treeStore", "readonly");
        const req = tx.objectStore("treeStore").get("CURRENT_TREE");
        req.onsuccess = () => resolve(req.result ? req.result.data : null);
        req.onerror = () => resolve(null);
      });
    }

    // 4. KHỞI CHẠY TRANG
    window.addEventListener("DOMContentLoaded", async () => {
      if (sessionStorage.getItem("tree_unlocked") === "yes") {
        document.getElementById("lockOverlay").style.display = "none";
      }
      await initDB();
      familyTreeData = await loadFromDB();
      if (!familyTreeData) {
        familyTreeData = defaultData;
        saveToDB(false);
      }
      renderTree();
    });

    // 5. VẼ CÂY GIA PHẢ
    function renderTree() {
      const container = document.getElementById("treeContainer");
      container.innerHTML = "";
      if (!familyTreeData) return;
      const treeElem = document.createElement("div");
      treeElem.className = "tree";
      const ul = document.createElement("ul");
      ul.appendChild(buildNode(familyTreeData));
      treeElem.appendChild(ul);
      container.appendChild(treeElem);
      applyZoom();
    }

    function buildNode(node) {
      const li = document.createElement("li");
      const couple = document.createElement("div");
      couple.className = "couple-node";

      couple.appendChild(makeCard(node));
      if (node.spouse) {
        const ring = document.createElement("div");
        ring.className = "ring-connector";
        ring.innerHTML = "💍";
        couple.appendChild(ring);
        couple.appendChild(makeCard(node.spouse, true));
      }
      li.appendChild(couple);

      if (node.children && node.children.length > 0) {
        const cul = document.createElement("ul");
        node.children.forEach(c => cul.appendChild(buildNode(c)));
        li.appendChild(cul);
      }
      return li;
    }

    function makeCard(person, isSpouse = false) {
      const card = document.createElement("div");
      card.className = `person-card ${person.gender || 'male'}`;
      const defaultImg = person.gender === 'female'
        ? "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23d81b60'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"
        : "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230288d1'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";

      card.innerHTML = `
        <div class="avatar-wrapper"><img src="${person.avatar || defaultImg}"></div>
        <div class="person-name">${person.name}</div>
        <div class="person-meta">${person.year || 'Thành viên'}</div>
        <div class="card-actions">
          <button class="action-icon" onclick="editPerson('${person.id}')">✏️</button>
          ${isSpouse || person.id !== familyTreeData.id ? `<button class="action-icon" style="color:#ef4444;" onclick="delPerson('${person.id}')">🗑️</button>` : ''}
          <button class="action-icon" onclick="openChoice('${person.id}')">➕</button>
        </div>
      `;
      return card;
    }

    // 6. THAO TÁC FORM
    function openChoice(id) { selectedId = id; openModal("choiceModal"); }
    function triggerForm(rel) {
      closeModal("choiceModal");
      document.getElementById("memberForm").reset();
      document.getElementById("fId").value = "";
      document.getElementById("fTarget").value = selectedId;
      document.getElementById("fRel").value = rel;
      document.getElementById("prevImg").style.display = "none";
      tempAvatar = "";
      const t = { parent: "Thêm Cha / Mẹ", spouse: "Thêm Vợ / Chồng", child: "Thêm Con Cái" };
      document.getElementById("modalTitle").innerText = t[rel];
      openModal("formModal");
    }

    function editPerson(id) {
      const n = findNode(familyTreeData, id);
      if (!n) return;
      document.getElementById("memberForm").reset();
      document.getElementById("fId").value = n.id;
      document.getElementById("fRel").value = "edit";
      document.getElementById("fName").value = n.name || "";
      document.getElementById("fGender").value = n.gender || "male";
      document.getElementById("fYear").value = n.year || "";
      tempAvatar = n.avatar || "";
      const p = document.getElementById("prevImg");
      if (tempAvatar) { p.src = tempAvatar; p.style.display = "block"; } else { p.style.display = "none"; }
      document.getElementById("modalTitle").innerText = "Chỉnh Sửa Thông Tin";
      openModal("formModal");
    }

    function submitForm(e) {
      e.preventDefault();
      const id = document.getElementById("fId").value;
      const targetId = document.getElementById("fTarget").value;
      const rel = document.getElementById("fRel").value;
      const name = document.getElementById("fName").value.trim();
      const gender = document.getElementById("fGender").value;
      const year = document.getElementById("fYear").value.trim();

      if (rel === "edit") {
        const n = findNode(familyTreeData, id);
        if (n) { n.name = name; n.gender = gender; n.year = year; if (tempAvatar) n.avatar = tempAvatar; }
      } else if (rel === "parent") {
        const oldRoot = familyTreeData;
        familyTreeData = { id: "p_" + Date.now(), name, gender, year, avatar: tempAvatar, children: [oldRoot] };
      } else if (rel === "spouse") {
        const target = findNode(familyTreeData, targetId);
        if (target) target.spouse = { id: "p_" + Date.now(), name, gender, year, avatar: tempAvatar };
      } else if (rel === "child") {
        const target = findNode(familyTreeData, targetId);
        if (target) {
          if (!target.children) target.children = [];
          target.children.push({ id: "p_" + Date.now(), name, gender, year, avatar: tempAvatar, children: [] });
        }
      }
      closeModal("formModal");
      saveToDB(false);
      renderTree();
    }

    function delPerson(id) {
      if (!confirm("Xóa thành viên này?")) return;
      delNode(familyTreeData, id);
      saveToDB(false);
      renderTree();
    }

    function delNode(root, id) {
      if (!root) return false;
      if (root.spouse && root.spouse.id === id) { delete root.spouse; return true; }
      if (root.children) {
        const idx = root.children.findIndex(c => c.id === id);
        if (idx !== -1) { root.children.splice(idx, 1); return true; }
        for (let ch of root.children) { if (delNode(ch, id)) return true; }
      }
      return false;
    }

    function findNode(node, id) {
      if (!node) return null;
      if (node.id === id) return node;
      if (node.spouse && node.spouse.id === id) return node.spouse;
      if (node.children) {
        for (let c of node.children) {
          const res = findNode(c, id);
          if (res) return res;
        }
      }
      return null;
    }

    function uploadAvatar(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxDim = 200;
          let w = img.width, h = img.height;
          if (w > h) { if (w > maxDim) { h = (h * maxDim) / w; w = maxDim; } }
          else { if (h > maxDim) { w = (w * maxDim) / h; h = maxDim; } }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          tempAvatar = canvas.toDataURL("image/jpeg", 0.8);
          const prev = document.getElementById("prevImg");
          prev.src = tempAvatar;
          prev.style.display = "block";
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function exportFile() {
      if (!familyTreeData) return;
      const blob = new Blob([JSON.stringify(familyTreeData, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "cay_gia_pha_ho_lam.json";
      a.click();
    }

    function importFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed && parsed.name) {
            familyTreeData = parsed;
            saveToDB(false);
            renderTree();
            alert("✅ Phục hồi dữ liệu thành công!");
          }
        } catch(err) { alert("Lỗi đọc file!"); }
      };
      reader.readAsText(file);
    }

    function resetDefault() {
      if (confirm("Khôi phục lại dữ liệu gốc họ Lâm?")) {
        familyTreeData = JSON.parse(JSON.stringify(defaultData));
        saveToDB(false);
        renderTree();
      }
    }

    function zoom(delta) {
      zoomLevel = Math.min(Math.max(0.2, zoomLevel + delta), 2.5);
      applyZoom();
    }
    function applyZoom() {
      document.getElementById("treeContainer").style.transform = `scale(${zoomLevel})`;
      document.getElementById("zoomDisplay").innerText = Math.round(zoomLevel * 100) + "%";
    }

    function openModal(id) { document.getElementById(id).classList.add("active"); }
    function closeModal(id) { document.getElementById(id).classList.remove("active"); }
  </script>
</body>
</html>
