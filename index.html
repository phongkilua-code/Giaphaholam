<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gia Phả Dòng Họ Lâm</title>
  <style>
    body { font-family: sans-serif; background: #f1f5f9; margin: 0; padding: 20px; text-align: center; }
    .header { background: #1565c0; color: white; padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; }
    .node-wrap { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 30px; }
    .card { background: white; border: 2px solid #cbd5e1; border-radius: 10px; width: 140px; padding: 12px 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .card.male { border-top: 5px solid #0288d1; }
    .card.female { border-top: 5px solid #d81b60; }
    .avatar { width: 55px; height: 55px; border-radius: 6px; background: #e2e8f0; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name { font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; }
    .meta { font-size: 0.75rem; color: #64748b; }
    .btn-act { margin-top: 8px; font-size: 0.8rem; background: #f8fafc; border: 1px solid #cbd5e1; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    .sub-title { font-weight: bold; color: #334155; margin: 20px 0 10px; }
  </style>
</head>
<body>

  <div class="header">
    🌳 CÂY GIA PHẢ DÒNG HỌ LÂM (TRỰC TUYẾN)
  </div>

  <div class="sub-title">THẾ HỆ ĐẦU TIÊN</div>
  <div class="node-wrap">
    <div class="card male">
      <div class="avatar"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230288d1'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"></div>
      <div class="name">Lâm Thành Lai</div>
      <div class="meta">Đã mất</div>
    </div>

    <div style="display:flex;align-items:center;font-size:1.5rem;">💍</div>

    <div class="card female">
      <div class="avatar"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23d81b60'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"></div>
      <div class="name">Diệp Thị Dai</div>
      <div class="meta">Thành viên</div>
    </div>
  </div>

  <div class="sub-title">THẾ HỆ CON CHÁU</div>
  <div class="node-wrap">
    <div class="card male">
      <div class="avatar"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230288d1'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"></div>
      <div class="name">Lâm Thành Cơ</div>
      <div class="meta">Con trai</div>
    </div>

    <div class="card male">
      <div class="avatar"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230288d1'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"></div>
      <div class="name">Lâm Thành Nhã</div>
      <div class="meta">Con trai</div>
    </div>
  </div>

</body>
</html>
