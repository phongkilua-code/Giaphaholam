<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.6, minimum-scale=0.1, maximum-scale=3.0, user-scalable=yes">
  <title>Cây Gia Phả Dòng Họ Lâm - Đám Mây</title>
  <style>
    :root {
      --primary: #1565c0;
      --bg: #f8fafc;
      --border: #cbd5e1;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --male-color: #0288d1;
      --female-color: #d81b60;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Lớp phủ màn hình khóa */
    #lockOverlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .lock-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 26px 20px;
      width: 100%;
      max-width: 330px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .lock-card input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
      font-family: inherit;
    }
    .lock-card input:focus {
      border-color: var(--primary);
    }
    .btn-unlock {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: block;
    }
    .btn-unlock:active {
      background: #0d47a1;
      transform: scale(0.98);
    }

    nav {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      z-index: 100;
    }
    .nav-brand { font-size: 1.05rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 6px; }
    .status-cloud { font-size: 0.75rem; color: #10b981; font-weight: 600; }
    .nav-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn {
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-save { background: #2e7d32; color: #fff; }
    .btn-file { background: #f1f5f9; color: #334155; border-color: var(--border); }

    #viewport {
      flex: 1;
      overflow: auto;
      padding: 60px 30px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      position: relative;
    }
    .tree-wrapper {
      display: inline-block;
      margin: auto;
      transform-origin: top center;
      transition: transform 0.1s ease-out;
    }
    .tree, .tree ul {
      display: flex;
      justify-content: center;
      padding-top: 25px;
      position: relative;
      list-style-type: none;
    }
    .tree li {
      float: left;
      text-align: center;
      list-style-type: none;
      position: relative;
      padding: 25px 10px 0 10px;
    }
    .tree li::before, .tree li::after {
      content: '';
      position: absolute;
      top: 0;
      right: 50%;
      border-top: 2px solid #94a3b8;
      width: 50%;
      height: 25px;
    }
    .tree li::after { right: auto; left: 50%; border-left: 2px solid #94a3b8; }
    .tree li:only-child::after, .tree li:only-child::before { display: none; }
    .tree li:only-child { padding-top: 0; }
    .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
    .tree li:last-child::before { border-right: 2px solid #94a3b8; border-radius: 0 8px 0 0; }
    .tree li:first-child::after { border-radius: 8px 0 0 0; }
    .tree ul::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      border-left: 2px solid #94a3b8;
      width: 0;
      height: 25px;
    }
    .couple-node { display: inline-flex; align-items: center; gap: 10px; }
    .ring-connector {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fef3c7;
      border: 1px dashed #d97706;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }
    .person-card {
      width: 140px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.04);
    }
    .person-card.male { border-top: 4px solid var(--male-color); }
    .person-card.female { border-top: 4px solid var(--female-color); }
    .avatar-wrapper {
      width: 55px;
      height: 55px;
      border-radius: 6px;
      margin: 0 auto 6px;
      overflow: hidden;
      background: #f1f5f9;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .person-name { font-weight: 700; font-size: 0.85rem; margin-bottom: 2px; }
    .person-meta { font-size: 0.72rem; color: var(--text-sub); }
    .card-actions {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-around;
    }
    .action-icon { font-size: 0.8rem; border: none; background: none; cursor: pointer; color: var(--primary); }

    .floating-zoom {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 90;
    }
    .zoom-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 15px;
    }
    .modal-overlay.active { display: flex; }
    .modal-window {
      background: #fff;
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 3px; color: var(--text-sub); }
    .form-group input, .form-group select {
      width: 100%; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.85rem; outline: none;
    }
    .preview-box { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; display: none; margin-top: 6px; }
    .choice-box { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .choice-btn {
      padding: 10px; border: 1px solid var(--border); background: #f8fafc; border-radius: 8px; cursor: pointer; text-align: left; display: flex; gap: 10px; align-items: center;
    }
  </style>
</head>
<body>

  <!-- Khóa Mật Mã 123456 có hỗ trợ Enter và Touch Event -->
  <div id="lockOverlay">
    <div class="lock-card">
      <div style="font-size:2.6rem;margin-bottom:8px;">🔒</div>
      <h3 style="margin-bottom:6px;">Bảo Mật Gia Phả</h3>
      <p style="font-size:0.8rem;color:#64748b;margin-bottom:14px;">Mật mã: <strong>123456</strong></p>
      
      <input type="password" id="inputPass" placeholder="Nhập 123456" inputmode="numeric" onkeydown="if(event.key==='Enter') unlockTree();">
      
      <button class="btn-unlock" id="btnUnlock" onclick="unlockTree()">MỞ KHÓA</button>
      
      <div id="errPass" style="color:#ef4444;font-size:0.8rem;margin-top:10px;display:none;font-weight:600;">Mật khẩu không đúng!</div>
    </div>
  </div>

  <nav>
    <div class="nav-brand">
      🌳 Gia Phả Họ Lâm
      <span class="status-cloud" id="cloudStatus">☁️ Đang kết nối...</span>
    </div>
    <div class="nav-actions">
      <button class="btn btn-save" onclick="refreshFromCloud()">🔄 Tải Lại</button>
      <button class="btn btn-file" onclick="exportFile()">📥 Xuất Tệp</button>
    </div>
  </nav>

  <main id="viewport">
    <div class="tree-wrapper" id="treeContainer"></div>
  </main>

  <div class="floating-zoom">
    <button class="zoom-btn" onclick="zoom(-0.15)">➖</button>
    <span id="zoomDisplay" style="font-size:0.85rem;font-weight:700;min-width:48px;text-align:center;">100%</span>
    <button class="zoom-btn" onclick="zoom(0.15)">➕</button>
  </div>

  <div class="modal-overlay" id="choiceModal">
    <div class="modal-window">
      <h3 style="font-size:1.05rem;margin-bottom:12px;">Thêm Mối Quan Hệ</h3>
      <div class="choice-box">
        <button class="choice-btn" onclick="triggerForm('parent')">
          <span style="font-size:1.4rem;">🧓</span>
          <div><strong>Thêm Cha / Mẹ</strong><div style="font-size:0.75rem;color:#64748b;">Đẩy người hiện tại xuống làm con</div></div>
        </button>
        <button class="choice-btn" onclick="triggerForm('spouse')">
          <span style="font-size:1.4rem;">💍</span>
          <div><strong>Thêm Vợ / Chồng</strong><div style="font-size:0.75rem;color:#64748b;">Nối nhánh ngang hàng</div></div>
        </button>
        <button class="choice-btn" onclick="triggerForm('child')">
          <span style="font-size:1.4rem;">👶</span>
          <div><strong>Thêm Con Cái</strong><div style="font-size:0.75rem;color:#64748b;">Tạo con cháu thế hệ sau</div></div>
        </button>
      </div>
      <button class="btn btn-file" style="width:100%;margin-top:12px;justify-content:center;" onclick="closeModal('choiceModal')">Hủy</button>
    </div>
  </div>

  <div class="modal-overlay" id="formModal">
    <div class="modal-window">
      <h3 style="font-size:1.05rem;margin-bottom:12px;" id="modalTitle">Thông Tin Thành Viên</h3>
      <form id="memberForm" onsubmit="submitForm(event)">
        <input type="hidden" id="fId">
        <input type="hidden" id="fTarget">
        <input type="hidden" id="fRel">

        <div class="form-group">
          <label>Họ và Tên (*)</label>
          <input type="text" id="fName" required>
        </div>
        <div style="display:flex;gap:8px;">
          <div class="form-group" style="flex:1;">
            <label>Giới tính</label>
            <select id="fGender">
              <option value="male">Nam</option>
              <option value="female">Nữ</option>
            </select>
          </div>
          <div class="form-group" style="flex:1;">
            <label>Năm sinh / Ghi chú</label>
            <input type="text" id="fYear" placeholder="Ví dụ: 1965">
          </div>
        </div>
        <div class="form-group">
          <label>Ảnh đại diện (Tự nén và lưu trực tiếp lên đám mây)</label>
          <input type="file" id="fAvatar" accept="image/*" onchange="uploadAvatar(event)">
          <img id="prevImg" class="preview-box">
        </div>

        <div style="display:flex;gap:8px;margin-top:14px;">
          <button type="submit" class="btn btn-save" style="
