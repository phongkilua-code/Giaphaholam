<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.6, minimum-scale=0.1, maximum-scale=3.0, user-scalable=yes">
  <title>Cây Gia Phả Dòng Họ Lâm - Đám Mây</title>
  <style>
    :root {
      --primary: #1565c0;
      --bg: #f8fafc;
      --border: #cbd5e1;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --male-color: #0288d1;
      --female-color: #d81b60;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    nav {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      z-index: 100;
    }
    .nav-brand { font-size: 1.05rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 6px; }
    .status-cloud { font-size: 0.75rem; color: #10b981; font-weight: 600; }
    .nav-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn {
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-save { background: #2e7d32; color: #fff; }
    .btn-file { background: #f1f5f9; color: #334155; border-color: var(--border); }

    #viewport {
      flex: 1;
      overflow: auto;
      padding: 60px 30px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      position: relative;
    }
    .tree-wrapper {
      display: inline-block;
      margin: auto;
      transform-origin: top center;
      transition: transform 0.1s ease-out;
    }
    .tree, .tree ul {
      display: flex;
      justify-content: center;
      padding-top: 25px;
      position: relative;
      list-style-type: none;
    }
    .tree li {
      float: left;
      text-align: center;
      list-style-type: none;
      position: relative;
      padding: 25px 10px 0 10px;
    }
    .tree li::before, .tree li::after {
      content: '';
      position: absolute;
      top: 0;
      right: 50%;
      border-top: 2px solid #94a3b8;
      width: 50%;
      height: 25px;
    }
    .tree li::after { right: auto; left: 50%; border-left: 2px solid #94a3b8; }
    .tree li:only-child::after, .tree li:only-child::before { display: none; }
    .tree li:only-child { padding-top: 0; }
    .tree li:first-child::before, .tree li:last-child::after
